name: Smash MVP Web Preview

on:
  push:
    branches: [main, oneshot-mvp]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          if [ -d /root/.local/share/godot/export_templates/4.7.2.stable ]; then
            cp -R /root/.local/share/godot/export_templates/4.7.2.stable ~/.local/share/godot/export_templates/
          elif [ -d /root/.local/share/godot/templates/4.7.2.stable ]; then
            cp -R /root/.local/share/godot/templates/4.7.2.stable ~/.local/share/godot/export_templates/
          fi
      - name: Parse project
        run: godot --headless --editor --path . --quit-after 3
      - name: Startup smoke test
        run: godot --headless --path . --quit-after 5
      - name: Export Web
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
      - name: Publish static build branch
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: web
          publish_dir: ./build/web
          force_orphan: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
